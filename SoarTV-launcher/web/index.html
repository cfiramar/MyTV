<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>SoarTV</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='8'%20fill='%232563EB'/%3E%3Cpolygon%20points='12,9%2024,16%2012,23'%20fill='%23FFF'/%3E%3C/svg%3E">
<link rel="stylesheet" href="home.css">
</head>
<body class="night">
<script>
  // Restore last active Twilight Aurora (dark) or Daylight (light) theme before first paint.
  try {
    if (localStorage.getItem('soartv.night') === 'false') {
      document.documentElement.style.background = '#F4F6FA';
      document.body.className = '';
    } else {
      document.documentElement.style.background = '#161826';
      document.body.className = 'night';
    }
  } catch (e) {}
</script>
<div id="stage">
  <div id="sky" class="layer">
    <div class="aurora day"></div>
    <div class="aurora night"></div>
    <div id="hero-bg" class="layer">
      <div id="heroA" class="hero-img"></div>
      <div id="heroB" class="hero-img"></div>
      <div class="hero-vig-left"></div>
      <div class="hero-vig-bottom"></div>
      <div class="hero-vig-top"></div>
    </div>
  </div>

  <div id="topbar">
    <div id="nav-tabs"></div>
    <div id="top-status">
      <button id="profile-pill" class="status-pill"></button>
      <span id="remote-pill" class="status-pill remote-pill"></span>
      <span id="weather-pill" class="status-pill"></span>
      <span id="top-clock"></span>
    </div>
  </div>

  <div id="screens" class="layer">
    <!-- Home Screen -->
    <div id="screen-home" class="screen active">
      <div id="shelf-hint" class="shelf-hint"></div>
      <div id="hero-details">
        <h1 id="hero-title"></h1>
        <div id="hero-meta"></div>
        <div id="hero-genres"></div>
        <div id="hero-continue"></div>
        <div id="hero-overview"></div>
        <div id="subtab-bar"></div>
      </div>
      <div id="clock"><span class="time"></span><span class="date"></span><span class="clock-sub"></span></div>
      <div id="home-rows-clip">
        <div id="home-rows"></div>
      </div>
    </div>

    <!-- Search Screen (Unified + Gemini AI) -->
    <div id="screen-search" class="screen">
      <div id="search-header">
        <div id="search-input-wrap">
          <span id="search-ico"></span>
          <input id="search-input" type="text" autocomplete="off" spellcheck="false" />
        </div>
        <button id="search-btn-go" class="search-action"></button>
        <button id="search-btn-ai" class="search-action ai"></button>
      </div>
      <div id="search-ai-card"></div>
      <div id="search-results-clip">
        <div id="search-results"></div>
      </div>
    </div>

    <!-- Apps Screen -->
    <div id="screen-apps" class="screen">
      <div id="apps-grid-clip">
        <div id="apps-grid"></div>
      </div>
    </div>

    <!-- Gaming Screen -->
    <div id="screen-gaming" class="screen">
      <div id="gaming-pills"></div>
      <div id="gaming-rows-clip">
        <div id="gaming-rows"></div>
      </div>
    </div>

    <!-- Smart-Home Screen -->
    <div id="screen-smarthome" class="screen">
      <div id="smarthome-rows-clip">
        <div id="smarthome-rows"></div>
      </div>
    </div>

    <!-- Two-Panel Settings Screen (38% Left Rail / 62% Right Pane) -->
    <div id="screen-settings" class="screen">
      <div id="settings-left" class="glass-panel">
        <div id="settings-left-head"></div>
        <div id="settings-left-list"></div>
      </div>
      <div id="settings-right" class="glass-panel">
        <div id="settings-right-head"></div>
        <div id="settings-right-clip">
          <div id="settings-right-rows"></div>
        </div>
      </div>
      <div id="settings-footer"></div>
    </div>
  </div>

  <!-- Hidden Favorite Apps Side-Shelf Overlay -->
  <div id="sideshelf-veil" class="layer"></div>
  <div id="sideshelf">
    <div id="sideshelf-title"></div>
    <div id="sideshelf-list-clip">
      <div id="sideshelf-list"></div>
    </div>
    <div id="sideshelf-arrow"></div>
  </div>

  <!-- Modals & Pickers -->
  <div id="context-modal" class="layer sheet"><div class="box"></div></div>
  <div id="trakt-modal" class="layer sheet"><div class="box"></div></div>
  <div id="input-modal" class="layer sheet"><div class="box"></div></div>
  <div id="shelfedit" class="layer sheet"><div class="box"></div></div>
  <div id="langpick" class="layer sheet"><div class="box"></div></div>
  <div id="citypick" class="layer sheet"><div class="box"></div></div>
  <div id="keypick" class="layer sheet"><div class="box"></div></div>
  <div id="about" class="layer sheet"><div class="box"></div></div>

  <!-- Dim, Ambient Clock & Photo Screensaver, Toast -->
  <div id="dim" class="layer"></div>
  <div id="ambient" class="layer"></div>
  <div id="saver" class="layer"></div>
  <div id="toast"></div>
</div>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="strings.js"></script>
<script src="crypto.js"></script>
<script src="icons.js"></script>
<script src="tv.js"></script>
<script src="zones.js"></script>
<script src="services.js"></script>
<script src="data.js"></script>
<script src="home.js"></script>
</body>
</html>
