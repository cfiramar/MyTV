name: Build & Publish SoarTV Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v1.5.0)'
        required: true
        default: 'v1.5.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Android Build Tools & Platform 34
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" \
            "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"

      - name: Build Companion Remote Bundle
        working-directory: SoarTV-remote
        run: |
          npm ci
          npm run build
          npm test

      - name: Restore Signing Keystore (if configured in GitHub Secrets)
        if: env.SOARTV_KEYSTORE_BASE64 != ''
        env:
          SOARTV_KEYSTORE_BASE64: ${{ secrets.SOARTV_KEYSTORE_BASE64 }}
        run: |
          echo "$SOARTV_KEYSTORE_BASE64" | base64 -d > SoarTV-launcher/soartv.keystore

      - name: Update versionCode and versionName in AndroidManifest.xml
        run: |
          TAG="${{ github.event.inputs.version_tag || github.ref_name }}"
          VER="${TAG#v}"
          VCODE="$(python3 -c "p=[int(x) for x in '$VER'.split('-')[0].split('.') if x.isdigit()]; p=(p+[0,0,0])[:3]; print(p[0]*10000+p[1]*100+p[2])")"
          sed -i "s/android:versionCode=\"[^\"]*\"/android:versionCode=\"$VCODE\"/" SoarTV-launcher/app/AndroidManifest.xml
          sed -i "s/android:versionName=\"[^\"]*\"/android:versionName=\"$VER\"/" SoarTV-launcher/app/AndroidManifest.xml
          echo "Set AndroidManifest.xml versionName=$VER versionCode=$VCODE"

      - name: Build SoarTV Packages & Setup Studio Archive
        env:
          SOARTV_RELEASE_REPO: ${{ github.repository }}
        run: |
          (cd SoarTV-launcher && bash ./build.sh --generic && python3 webos/build.py --generic && python3 tizen/build.py --generic)
          python3 -c '
          import glob, zipfile, os
          items = [
              "setup_wizard.py", "README.md", "AGENTS.md", "CLAUDE.md",
              ".env.example", "SoarTV-launcher/config.example.properties",
              "SoarTV-launcher/tools/setup_gui/wizard_app.py",
              "SoarTV-launcher/tools/setup_gui/static/index.html",
              "docs/supabase-schema.sql", "docs/agents/install-playbook.md", "docs/agents/tv-brand-adaptation.md",
          ] + sorted(glob.glob("SoarTV-launcher/tools/setup_gui/static/guides/*"))
          with zipfile.ZipFile("SoarTV-Setup-Studio.zip", "w", zipfile.ZIP_DEFLATED) as zf:
              for p in items:
                  if os.path.isfile(p):
                      zf.write(p, p)
          '

      - name: Create GitHub Release & Upload Packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag || github.ref_name }}
          name: SoarTV ${{ github.event.inputs.version_tag || github.ref_name }}
          files: |
            SoarTV-launcher/SoarTV.apk
            SoarTV-launcher/SoarTV-Remote.apk
            SoarTV-launcher/SoarTV-webos.ipk
            SoarTV-launcher/SoarTV-tizen.wgt
            SoarTV-Setup-Studio.zip
          generate_release_notes: true
