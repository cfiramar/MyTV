name: Build & Publish MyTV Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v1.5.0)'
        required: true
        default: 'v1.5.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Android Build Tools & Platform 34
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" \
            "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"

      - name: Build Companion Remote Bundle
        working-directory: MyTV-remote
        run: |
          npm ci
          npm run build
          npm test

      - name: Restore Signing Keystore (if configured in GitHub Secrets)
        if: env.MYTV_KEYSTORE_BASE64 != ''
        env:
          MYTV_KEYSTORE_BASE64: ${{ secrets.MYTV_KEYSTORE_BASE64 }}
        run: |
          echo "$MYTV_KEYSTORE_BASE64" | base64 -d > MyTV-launcher/mytv.keystore

      - name: Update versionName in AndroidManifest.xml
        run: |
          TAG="${{ github.event.inputs.version_tag || github.ref_name }}"
          VER="${TAG#v}"
          sed -i "s/android:versionName=\"[^\"]*\"/android:versionName=\"$VER\"/" MyTV-launcher/app/AndroidManifest.xml

      - name: Build MyTV Packages & Setup Studio Archive
        run: |
          (cd MyTV-launcher && bash ./build.sh --generic && python3 webos/build.py --generic && python3 tizen/build.py --generic)
          python3 -c '
          import zipfile, os
          items = [
              "Setup-MyTV.bat", "setup-mytv.sh", "setup_wizard.py", "README.md", "AGENTS.md", "CLAUDE.md",
              ".env.example", "MyTV-launcher/config.example.properties",
              "MyTV-launcher/tools/setup_gui/wizard_app.py",
              "MyTV-launcher/tools/setup_gui/static/index.html",
              "docs/supabase-schema.sql", "docs/agents/install-playbook.md", "docs/agents/tv-brand-adaptation.md",
          ]
          with zipfile.ZipFile("MyTV-Setup-Studio.zip", "w", zipfile.ZIP_DEFLATED) as zf:
              for p in items:
                  if os.path.isfile(p):
                      zf.write(p, p)
          '

      - name: Create GitHub Release & Upload Packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag || github.ref_name }}
          name: MyTV ${{ github.event.inputs.version_tag || github.ref_name }}
          files: |
            MyTV-launcher/MyTV.apk
            MyTV-launcher/MyTV-Remote.apk
            MyTV-launcher/MyTV-webos.ipk
            MyTV-launcher/MyTV-tizen.wgt
            MyTV-Setup-Studio.zip
          generate_release_notes: true
