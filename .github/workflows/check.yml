name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: MyTV Android & Companion Remote Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Android SDK (build-tools 34, android-34)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" \
            "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
      - name: Build & Test Companion Remote
        working-directory: MyTV-remote
        run: |
          npm ci
          npm run build
          npm test
      - name: Build MyTV APKs & Run All Verification Suites
        working-directory: MyTV-launcher
        run: bash tools/check.sh
