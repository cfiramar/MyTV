# MyTV settings template.
# build.sh copies this file to config.properties the first time; edit config.properties (git-ignored) and rebuild.

# --- Media Discovery, Ratings & AI Search ---
# Free TMDB key or API Read Access Token: https://www.themoviedb.org/settings/api
tmdb_key=

# Optional free keys for Rotten Tomatoes (RT) and Metacritic (MC) ratings on media cards:
# - OMDb API key (free 1,000/day): https://www.omdbapi.com/apikey.aspx
# - MDBList API key (free 1,000/day, sign in directly at MDBList): https://mdblist.com/preferences/
omdb_key=
mdblist_key=

# Optional free Google Gemini API key (https://aistudio.google.com/app/apikey) for AI Search & natural-language discovery:
gemini_api_key=

# Optional free Trakt Client ID (https://trakt.tv/oauth/applications, Redirect URI: urn:ietf:wg:oauth:2.0:oob):
trakt_client_id=
trakt_username=

# Optional Stremio account email & AIOStreams manifest URL (Stremio auth token is stored encrypted via Secrets):
stremio_email=
aiostreams_manifest_url=
cinemeta_url=https://v3-cinemeta.strem.io

# --- Cloud Sync & Household Vault (Supabase Free Tier) ---
supabase_url=
supabase_anon_key=

# Optional comma-separated Google account email whitelist for Companion Remote Owner/Admin OAuth recovery:
admin_emails=

# Optional GitHub repository slug (e.g. your-username/MyTV) for self-hosted OTA updates:
github_repo=

# --- Region, Weather & Appearance ---
# Two-letter ISO country code for streaming availability (US, GB, CA, DE, FR, BR, JP...):
tmdb_region=US

# Coordinates for Open-Meteo local weather and sunrise/sunset theme switching (decimal degrees):
latitude=40.7128
longitude=-74.0060
city=

# Language: auto (follows TV locale) or a code in app/assets/i18n (en, pt, es, de, ru, fr, ja, zh-CN...)
language=auto

# Temperature unit: C, F, or auto
temperature=auto

# Currency code for regional display
currency=USD

# Home theme: auto (dark from sunset to sunrise), light, or dark
theme=auto

# Exclude animation/anime titles from general discovery picks
hide_animation=false

# Open media picks directly in Stremio when installed
open_in_stremio=false

# Disable Google Assistant voice service when MyTV mode is active
disable_assistant=false

# Enable MyTV 4K Fine Art & Photography Ambient Screensaver
screensaver=true

# Comma-separated streaming services to hide from picks even if installed on the TV
hide_services=

# --- Optional Feature Tabs (Gaming & Smart Home) ---
# 'auto' = show tab automatically when devices/keys are configured, hide otherwise
# 'true' = always show tab | 'false' = always hide tab
enable_gaming=auto
enable_smarthome=auto

# --- Smart Home & Optional PC Gaming ---
# Smart Home non-secret device identifiers (API keys/secrets are pushed encrypted via tools/send_key.py --sync-config):
sensibo_device_id=
wiz_light_ips=
switcher_device_ip=
switcher_device_id=
tuya_device_id=
tuya_access_id=

# Optional Windows Gaming PC network defaults (auto-discovered on LAN via UDP port 8485):
gaming_pc_ip=
gaming_pc_mac=
gaming_pc_hdmi=HDMI 3

# Optional HDMI Port Roles (<port>:<role>:<label> comma-separated, role in console|streamer|laptop|free):
# Example: 1:console:PlayStation 5,2:streamer:Apple TV,3:laptop:Gaming PC
hdmi_port_roles=

# Companion Remote HTTP/WebSocket bridge port on the TV
remote_server_port=8484

# --- LG webOS & Samsung Tizen Web Launcher Options ---
# Comma-separated app IDs or names for the web shelf order / hidden apps:
shelf_apps=
hide_apps=

# Open with the inputs/weather drawer expanded on LG/Samsung TVs:
drawer_first=false

# Samsung Tizen: return to MyTV when pressing Home inside an app launched from MyTV:
samsung_home_button=false

# LG webOS: open media picks in Nuvio ('nuvio') or streaming apps ('apps'):
open_picks_in=apps

# Clock format override for webOS/Tizen ('auto', '24', or '12'):
clock_format=auto
